<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Tuner report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f5bea'/%3E%3Cpath d='M8 5v6a4 4 0 0 0 8 0V5M12 15v5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
// Theme: the saved choice is auto|light|dark; <html data-theme> always holds
// the resolved light|dark value, so the CSS needs only two palettes.
(function () {
  var KEY = "tuner-theme", MODES = ["auto", "light", "dark"];
  var ICONS = { auto: "\u25D0", light: "\u2600\uFE0E", dark: "\u263E" };
  var mq = matchMedia("(prefers-color-scheme: dark)");
  var root = document.documentElement, pref = "auto";
  try { pref = localStorage.getItem(KEY) || "auto"; } catch (e) {}
  if (MODES.indexOf(pref) < 0) pref = "auto";
  function apply() {
    root.dataset.theme = pref === "auto" ? (mq.matches ? "dark" : "light") : pref;
    var b = document.getElementById("theme");
    if (b) { b.textContent = ICONS[pref]; b.title = "Theme: " + pref + " (click to change)"; }
  }
  document.addEventListener("click", function (e) {
    if (!e.target.closest("#theme")) return;
    pref = MODES[(MODES.indexOf(pref) + 1) % MODES.length];
    try { localStorage.setItem(KEY, pref); } catch (err) {}
    apply();
  });
  mq.addEventListener("change", apply);
  document.addEventListener("DOMContentLoaded", apply);
  apply();
})();
</script>
<style>
/*__CSS__*/
</style>
</head>
<body>
<header id="top">
  <div class="brand"><strong>Tuner</strong></div>
  <nav id="nav">
    <a href="#/overview" data-r="overview">Overview</a>
    <a href="#/tasks" data-r="tasks">Expensive tasks</a>
    <a href="#/recs" data-r="recs">Recommendations</a>
    <a href="#/skills" data-r="skills">Skill history</a>
  </nav>
  <button id="theme" class="icon" type="button" aria-label="Change theme"></button>
</header>
<main id="app"><p class="muted">Loading…</p></main>
<noscript><p style="padding:1rem">This report needs JavaScript (no network required).</p></noscript>
<script type="application/json" id="tuner-data">/*__DATA__*/</script>
<script>

</script>
</body>
</html>
