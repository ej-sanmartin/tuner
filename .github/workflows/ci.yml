name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
  workflow_call:  # reused by release.yml before publishing

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest
        env:
          PYTHONWARNDEFAULTENCODING: "1"
      - name: Build and smoke-test the wheel
        shell: bash
        run: |
          uv build
          uv tool install --force dist/*.whl
          tuner --version
          uv run python scripts/check_wheel.py dist
        env:
          TUNER_HOME: ${{ runner.temp }}/tuner-ci
          TUNER_FAKE_HOME: ${{ runner.temp }}/home-ci
